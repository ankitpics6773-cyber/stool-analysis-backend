<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stool Analysis - Patient Entry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <style>
        body { background: #f8f9fa; }
        .card { border-radius: 1rem; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .btn-primary { background: linear-gradient(90deg, #4b6cb7, #182848); border: none; font-weight: 600; }
        .btn-primary:hover { background: linear-gradient(90deg, #182848, #4b6cb7); }
        .navbar { box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .form-label { font-weight: 600; }
        .container { padding-top: 50px; padding-bottom: 50px; }
        @media (max-width: 576px) { .card { margin: 0 1rem; } }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-light bg-white fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">Stool Analysis</a>
            <div class="d-flex align-items-center">
                <button class="btn btn-outline-success btn-sm me-2" id="install-pwa-button" style="display: none;">Install App</button>
                <a href="/login" class="btn btn-outline-primary">Admin Panel</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center mt-5 pt-5">
            <div class="col-lg-5 col-md-8 col-12">
                <div class="card p-4">
                    <div class="card-header text-center bg-white border-0">
                        <h3 class="fw-bold">👶 Patient Information & Sample Upload</h3>
                        <p class="text-muted small">Fill patient details and upload the stool image for analysis.</p>
                    </div>
                    <div class="card-body">
                        <form action="/user-upload" method="post" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="patient_name" class="form-label">Patient Name</label>
                                <input type="text" class="form-control" name="patient_name" placeholder="Enter patient name" required>
                            </div>
                            <div class="row mb-3">
                                <div class="col">
                                    <label for="age" class="form-label">Age</label>
                                    <input type="number" class="form-control" name="age" placeholder="Enter age" required>
                                </div>
                                <div class="col">
                                    <label for="sex" class="form-label">Sex</label>
                                    <select class="form-select" name="sex" required>
                                        <option value="male">Male</option>
                                        <option value="female">Female</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="image" class="form-label">Upload Stool Image</label>
                                <input type="file" class="form-control" name="image" accept="image/*" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">Next: Select Sample Area</button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer text-center text-muted small">
                        <p>Disclaimer: Preliminary analysis tool. Please consult a doctor for final diagnosis.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // PWA install button logic
        let deferredPrompt;
        const installButton = document.getElementById('install-pwa-button');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (installButton) {
                installButton.style.display = 'block';
            }
        });

        if (installButton) {
            installButton.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    console.log(`User response to the install prompt: ${outcome}`);
                    deferredPrompt = null;
                    installButton.disabled = true;
                }
            });
        }

        window.addEventListener('appinstalled', () => {
            if (installButton) {
                installButton.disabled = true;
            }
            deferredPrompt = null;
            console.log('PWA was installed');
        });

        // Service Worker registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => console.log('ServiceWorker registered:', registration.scope))
                    .catch(error => console.log('ServiceWorker registration failed:', error));
            });
        }
    </script>
</body>
</html>
