<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doctor Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <style>
        body {
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            padding: 30px 20px;
        }
        .btn-primary {
            background-color: #5A67D8;
            border: none;
        }
        .btn-primary:hover {
            background-color: #434190;
        }
        .card-title {
            font-weight: 700;
            color: #333;
        }
        .alert {
            font-size: 0.9rem;
        }
        .forgot-link {
            font-size: 0.9rem;
            color: #333;
            text-decoration: none;
        }
        .forgot-link:hover {
            color: #5A67D8;
        }
        @media (max-width: 576px) {
            .card {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center align-items-center" style="height: 100vh;">
            <div class="col-md-5 col-sm-8">
                <div class="card">
                    <h3 class="card-title text-center mb-4">Doctor Login</h3>
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} text-center">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                    <form method="post" action="/login">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Login</button>
                        </div>
                        <div class="text-center mt-3">
                            <a href="{{ url_for('forgot_password') }}" class="forgot-link">Forgot Password?</a>
                        </div>
                    </form>
                    <p class="text-center mt-3 text-muted" style="font-size:0.85rem;">
                        © {{ current_year }} Medical Analysis SaaS. All rights reserved.
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
